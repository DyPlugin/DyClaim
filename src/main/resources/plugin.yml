name: DyClaim
version: ${version}
main: dev.dyclaim.DyClaim
api-version: '1.20'
description: Lightweight chunk-based land claiming plugin with per-claim settings, trust system, and multi-language support.
author: DyClaim
website: https://modrinth.com/plugin/dyclaim
softdepend:
  - Vault
  - floodgate
  - WorldGuard
  - GriefPrevention
  - Towny
  - Lands
  - Residence
  - GriefDefender
  - SimpleClans

commands:
  claim:
    description: Chunk claim commands
    usage: /<command> [subcommand]
    aliases:
      - dyclaim
  unclaim:
    description: Remove your claim
    usage: /<command>
  onayla:
    description: Confirm pending action
    usage: /<command>
    aliases:
      - confirm
  reddet:
    description: Deny pending action
    usage: /<command>
    aliases:
      - cancel

permissions:
  dyclaim.player:
    description: All player permissions
    default: true
    children:
      dyclaim.claim: true
      dyclaim.sell: true
      dyclaim.see: true
      dyclaim.info: true
      dyclaim.list: true
      dyclaim.trust: true
      dyclaim.teleport: true
      dyclaim.settings: true
      dyclaim.coowner: true
      dyclaim.transfer: true
      dyclaim.market: true
      dyclaim.auto: true
      dyclaim.name: true
      dyclaim.setspawn: true
      dyclaim.warn: true
  dyclaim.admin:
    description: All admin permissions
    default: op
    children:
      dyclaim.player: true
      dyclaim.admin.bypass: true
  dyclaim.claim:
    description: Allow claiming chunks
    default: true
  dyclaim.sell:
    description: Allow selling claims
    default: true
  dyclaim.see:
    description: Allow viewing chunk borders
    default: true
  dyclaim.info:
    description: Allow viewing claim info
    default: true
  dyclaim.list:
    description: Allow viewing claim list
    default: true
  dyclaim.trust:
    description: Allow trusting players
    default: true
  dyclaim.teleport:
    description: Allow teleporting to claims
    default: true
  dyclaim.admin.bypass:
    description: Bypass claim protection
    default: op
  dyclaim.settings:
    default: true
    description: Change unlocked claim settings
  dyclaim.coowner:
    default: true
    description: Invite or remove one coowner
  dyclaim.transfer:
    default: true
    description: Offer ownership transfer
  dyclaim.market:
    default: true
    description: List or buy claims when the market is enabled
  dyclaim.auto:
    default: true
    description: Toggle automatic claiming
  dyclaim.name:
    default: true
    description: Name owned claims
  dyclaim.setspawn:
    default: true
    description: Set a safe claim spawn
  dyclaim.warn:
    default: true
    description: Warn unauthorized visitors when warnings are enabled
  dyclaim.warn.exempt:
    default: op
    description: Exemption from claim warning sanctions
  dyclaim.admin.purge:
    default: op
    description: Preview and confirm inactive claim cleanup
  dyclaim.admin.purge.exempt:
    default: op
    description: Exemption from inactive claim cleanup
