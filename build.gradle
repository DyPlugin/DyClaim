plugins {
    id 'java'
}

group = 'dev.dyclaim'
version = '1.2.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://repo.purpurmc.org/snapshots' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://maven.enginehub.org/repo/' }
    maven { url = 'https://repo.codemc.io/repository/maven-public/' }
    maven { url = 'https://repo.extendedclip.com/releases/' }
    maven { url = 'https://repo.bluecolored.de/releases/' }
    maven { url = 'https://repo.mikeprimm.com/' }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.20.4-R0.1-SNAPSHOT'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.9'
    compileOnly 'com.sk89q.worldedit:worldedit-bukkit:7.2.15'
    compileOnly 'com.github.TechFortress:GriefPrevention:16.18.2'
    compileOnly 'me.clip:placeholderapi:2.12.3'
    compileOnly 'com.github.BlueMap-Minecraft:BlueMapAPI:v2.6.2'
    compileOnly 'xyz.jpenilla:squaremap-api:1.2.7'
    compileOnly 'us.dynmap:DynmapCoreAPI:3.8'
    compileOnly 'net.kyori:adventure-text-minimessage:4.16.0'
    compileOnly 'net.kyori:adventure-text-serializer-legacy:4.16.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.purpurmc.purpur:purpur-api:1.20.4-R0.1-SNAPSHOT'
    testImplementation 'org.mockito:mockito-core:5.15.2'
    testImplementation 'com.github.MilkBowl:VaultAPI:1.7.1'
    testImplementation 'me.clip:placeholderapi:2.12.3'
    testImplementation 'com.github.TechFortress:GriefPrevention:16.18.2'
}

test { useJUnitPlatform() }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.jar {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    archiveBaseName.set('DyClaim')
    archiveVersion.set(version)
}

processResources {
    filesMatching('plugin.yml') {
        expand('version': version)
    }
}

// One JAR serves Bukkit, Spigot, Paper, Purpur and Folia. Folia servers on 1.1.0 or older look for a
// DyClaim-<version>-Folia.jar in update notices, so the same classes are also published under that name.
// A small marker keeps the two files distinct for download sites that reject identical files.
def compatResources = layout.buildDirectory.dir('generated/folia-compat')
tasks.register('prepareFoliaCompat') {
    outputs.dir(compatResources)
    doLast {
        def directory = compatResources.get().asFile
        directory.mkdirs()
        new File(directory, 'dyclaim-file.properties').setText('file=Folia-named copy of the single DyClaim JAR\n', 'UTF-8')
    }
}
tasks.register('foliaJar', Jar) {
    dependsOn classes, processResources, tasks.named('prepareFoliaCompat')
    archiveBaseName.set('DyClaim')
    archiveVersion.set(project.version)
    archiveClassifier.set('Folia')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(sourceSets.main.output)
    from(compatResources)
}

tasks.register('verifyPlatformArtifacts') {
    group = 'verification'
    description = 'Checks that both files carry the same plugin, declare Folia support and the release version.'
    dependsOn tasks.jar, tasks.named('foliaJar')
    doLast {
        def names = { file -> new java.util.zip.ZipFile(file).withCloseable { zip -> zip.stream().map { it.name }.filter { it != 'dyclaim-file.properties' }.sorted().toList() } }
        def single = tasks.jar.archiveFile.get().asFile
        def compat = tasks.named('foliaJar').get().archiveFile.get().asFile
        if (names(single) != names(compat)) throw new GradleException('The Folia-named copy differs from the single JAR')
        [single, compat].each { file ->
            new java.util.zip.ZipFile(file).withCloseable { zip ->
                def text = zip.getInputStream(zip.getEntry('plugin.yml')).getText('UTF-8')
                if (!text.contains("version: ${project.version}")) throw new GradleException("Wrong version in ${file.name}")
                if (!text.contains('folia-supported: true')) throw new GradleException("Missing Folia support in ${file.name}")
                if (zip.getEntry('dyclaim-platform.properties') != null) throw new GradleException("Old platform marker in ${file.name}")
                if (zip.stream().anyMatch { it.name.startsWith('dev/dyclaim/platform/proxy/') || it.name == 'dyclaim-bridge-version.properties' })
                    throw new GradleException("Archived proxy code leaked into ${file.name}")
            }
        }
    }
}


