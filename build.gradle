plugins {
    id 'java'
}

group = 'dev.dyclaim'
version = '1.0.3'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://repo.purpurmc.org/snapshots' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://maven.enginehub.org/repo/' }
    maven { url = 'https://repo.codemc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.20.4-R0.1-SNAPSHOT'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.9'
    compileOnly 'com.sk89q.worldedit:worldedit-bukkit:7.2.15'
    compileOnly 'com.github.TechFortress:GriefPrevention:16.18.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.purpurmc.purpur:purpur-api:1.20.4-R0.1-SNAPSHOT'
    testImplementation 'org.mockito:mockito-core:5.15.2'
    testImplementation 'com.github.MilkBowl:VaultAPI:1.7.1'
}

test { useJUnitPlatform() }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.jar {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    archiveBaseName.set('DyClaim')
    archiveVersion.set(version)
}

processResources {
    filesMatching('plugin.yml') {
        expand('version': version)
    }
}

def foliaResources = layout.buildDirectory.dir('generated/folia-resources')
tasks.register('prepareFoliaResources') {
    dependsOn processResources
    inputs.file(layout.buildDirectory.file('resources/main/plugin.yml'))
    outputs.dir(foliaResources)
    doLast {
        def directory = foliaResources.get().asFile
        directory.mkdirs()
        new File(directory, 'plugin.yml').setText(layout.buildDirectory.file('resources/main/plugin.yml').get().asFile.getText('UTF-8') + '\nfolia-supported: true\n', 'UTF-8')
        new File(directory, 'dyclaim-platform.properties').setText('platform=folia\n', 'UTF-8')
    }
}
tasks.register('foliaJar', Jar) {
    dependsOn classes, tasks.named('prepareFoliaResources')
    archiveBaseName.set('DyClaim')
    archiveVersion.set(project.version)
    archiveClassifier.set('Folia')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(sourceSets.main.output) { exclude 'plugin.yml', 'dyclaim-platform.properties' }
    from(foliaResources)
}

tasks.register('verifyPlatformArtifacts') {
    group = 'verification'
    description = 'Checks backend descriptors, versions and distribution isolation.'
    dependsOn tasks.jar, tasks.named('foliaJar')
    doLast {
        def distributions = [
            [tasks.jar.archiveFile.get().asFile, 'plugin.yml', 'bukkit'],
            [tasks.named('foliaJar').get().archiveFile.get().asFile, 'plugin.yml', 'folia']
        ]
        distributions.each { entry ->
            new java.util.zip.ZipFile(entry[0]).withCloseable { zip ->
                def descriptor = zip.getEntry(entry[1])
                if (descriptor == null) throw new GradleException("Missing ${entry[1]} in ${entry[0].name}")
                def text = zip.getInputStream(descriptor).getText('UTF-8')
                if (!(text =~ /(?m)["']?version["']?\s*:\s*["']?${java.util.regex.Pattern.quote(project.version.toString())}["']?\s*,?\s*$/).find())
                    throw new GradleException("Wrong version in ${entry[0].name}")
                if (zip.stream().anyMatch { it.name.startsWith('dev/dyclaim/platform/proxy/') || it.name == 'dyclaim-bridge-version.properties' })
                    throw new GradleException("Archived proxy code leaked into ${entry[0].name}")
                def marker = zip.getInputStream(zip.getEntry('dyclaim-platform.properties')).getText('UTF-8').trim()
                if (marker != "platform=${entry[2]}" || text.contains('folia-supported: true') != (entry[2] == 'folia'))
                    throw new GradleException("Wrong platform marker in ${entry[0].name}")
            }
        }
    }
}


